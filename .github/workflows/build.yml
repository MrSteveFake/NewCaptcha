name: Build from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract ZIP
      run: |
        find . -name "*.zip" -exec unzip {} -d . \;
        rm -f *.zip
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: mvn clean package
    
    - name: Upload Plugin
      uses: actions/upload-artifact@v4
      with:
        name: CaptchaPlugin
        path: target/CaptchaPlugin-*.jar
